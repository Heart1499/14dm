<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小雨披大导演 · 锐因不do不能出房间</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#0d0f14;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;padding:10px}
.app{width:100%;max-width:1100px;height:96vh;max-height:800px;display:flex;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.8);background:#14171f}

/* ===== 左侧面板 ===== */
.left-panel{width:300px;min-width:260px;background:#1a1e28;display:flex;flex-direction:column;border-right:1px solid #282e3c}
.panel-header{padding:16px 18px 12px;border-bottom:1px solid #282e3c}
.panel-header h1{font-size:17px;font-weight:800;color:#e3d9c6;letter-spacing:.5px}
.panel-header .sub{font-size:11px;color:#7f8aa5;margin-top:3px;letter-spacing:.4px}
.panel-body{flex:1;overflow-y:auto;padding:12px 14px 20px;scrollbar-width:thin}
.panel-body::-webkit-scrollbar{width:4px}
.panel-body::-webkit-scrollbar-thumb{background:#333d52;border-radius:10px}

.feed{background:#0d1018;border-radius:14px;padding:10px;border:1px solid #29303f;margin-bottom:12px}
.room{background:#181d28;border-radius:10px;padding:10px;position:relative;overflow:hidden}
.room::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.15) 3px,rgba(0,0,0,.15) 4px);pointer-events:none;border-radius:10px}
.actors{display:flex;gap:8px;position:relative;z-index:2}
.actor{flex:1;background:#202735;border-radius:10px;padding:8px 6px;text-align:center;border:1px solid #333c50}
.actor .nm{font-weight:700;color:#d8e0f5;font-size:13px}
.actor .tg{font-size:9px;color:#8b96b3;margin-top:2px}
.bars{display:flex;justify-content:space-between;gap:5px;margin-top:8px;position:relative;z-index:2}
.bar-item{flex:1;background:#0a0d14;border-radius:8px;padding:5px 3px;text-align:center}
.bar-item .lb{font-size:8px;color:#8b96b3;letter-spacing:.3px}
.bar-item .vl{font-size:14px;font-weight:800;color:#e5d6b8;margin-top:1px}
.bar-item .vl.red{color:#ff8473}
.bar-item .vl.blue{color:#7ea8ff}
.bar-item .vl.green{color:#84d6a0}
.progress-out{background:#070a10;border-radius:20px;height:5px;margin-top:6px;overflow:hidden;position:relative;z-index:2}
.progress-in{height:100%;width:0%;background:linear-gradient(90deg,#b7875e,#e5c48c);border-radius:20px;transition:width .3s}

.log{background:#070a10;border-radius:10px;padding:9px 10px;font-size:10px;color:#95a3bf;line-height:1.5;max-height:110px;overflow-y:auto;border-left:3px solid #5c4b38;scrollbar-width:thin}
.log::-webkit-scrollbar{width:3px}
.log::-webkit-scrollbar-thumb{background:#333d52}
.log div{margin-bottom:3px}

/* ===== 右侧面板 ===== */
.right-panel{flex:1;display:flex;flex-direction:column;background:#10131a;min-width:0}

.tab-header{display:flex;background:#0c0f16;border-bottom:1px solid #282e3c;flex-shrink:0}
.tab-btn{flex:1;padding:12px 0;text-align:center;font-size:13px;font-weight:600;color:#5a6478;cursor:pointer;transition:.15s;background:none;border:none;border-bottom:2px solid transparent;font-family:inherit;letter-spacing:.5px}
.tab-btn.active{color:#e5c48c;border-bottom-color:#e5c48c;background:#141a25}
.tab-content{flex:1;display:none;flex-direction:column;min-height:0}
.tab-content.active{display:flex}

/* 聊天区 */
.chat-body{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin}
.chat-body::-webkit-scrollbar{width:4px}
.chat-body::-webkit-scrollbar-thumb{background:#333d52;border-radius:10px}

/* 普通消息 */
.msg{display:flex;gap:8px;animation:msgIn .2s ease-out;max-width:82%}
.msg.left{align-self:flex-start}
.msg.right{align-self:flex-end;flex-direction:row-reverse}
.msg .avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.msg .avatar.fan{background:#2a3242;color:#b08ad6}
.msg .avatar.dir{background:#2a1f3d;color:#b08ad6}
.msg .bubble{background:#1e2635;border-radius:14px;padding:8px 12px;font-size:12px;color:#c4cfe4;line-height:1.5;max-width:100%}
.msg .bubble .who{font-size:9px;font-weight:700;margin-bottom:2px;display:block}
.msg .bubble .who.fan{color:#b08ad6}
.msg .bubble .who.dir{color:#b08ad6}
.msg.right .bubble{background:#2e271f;border:1px solid #5c4b38}

/* 特别角色消息 - 申惟 */
.msg.char-sw .avatar{background:linear-gradient(135deg,#3b2f22,#5c4b38);color:#e5c48c;font-size:14px;box-shadow:0 0 8px rgba(229,196,140,.25)}
.msg.char-sw .bubble{background:linear-gradient(135deg,#1e1a13,#2e271f);border:1px solid #6b553b;color:#e8dcc8;font-weight:500;box-shadow:0 2px 10px rgba(107,85,59,.2)}
.msg.char-sw .bubble .who{color:#e5c48c;font-size:10px;letter-spacing:.5px}

/* 特别角色消息 - 韩振 */
.msg.char-zj .avatar{background:linear-gradient(135deg,#1a2e24,#2a4a38);color:#84d6a0;font-size:14px;box-shadow:0 0 8px rgba(132,214,160,.25)}
.msg.char-zj .bubble{background:linear-gradient(135deg,#0f1e18,#1a2e24);border:1px solid #3a6b52;color:#c8e8d4;font-weight:500;box-shadow:0 2px 10px rgba(58,107,82,.2)}
.msg.char-zj .bubble .who{color:#84d6a0;font-size:10px;letter-spacing:.5px}

@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.sys-msg{text-align:center;font-size:10px;color:#5a6478;padding:3px 0;align-self:center}
.sys-msg.big{font-size:11px;color:#b7a88d;font-weight:600}

/* 空间区 */
.space-body{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.space-body::-webkit-scrollbar{width:4px}
.space-body::-webkit-scrollbar-thumb{background:#333d52;border-radius:10px}

.space-post{background:#0a0e15;border-radius:14px;padding:14px 16px;border-left:3px solid #5c4b38;animation:msgIn .25s;position:relative}
.space-post .post-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.space-post .post-header .who{font-size:11px;font-weight:700;color:#b08ad6}
.space-post .post-header .time{font-size:9px;color:#4a5468}
.space-post .post-content{font-size:12px;color:#c4cfe4;line-height:1.5;margin-bottom:10px}
.space-post .post-stats{display:flex;gap:16px;font-size:10px;color:#6b7690}
.space-post .post-stats span{display:flex;align-items:center;gap:4px;cursor:default}
.space-post .post-stats .stat-num{color:#8b96b3;font-weight:600;transition:.2s}
.space-post .post-stats .stat-num.grow{color:#e5c48c}

.comment-block{background:#0d1018;border-radius:12px;padding:10px 13px;margin-top:8px;border:1px solid #1e2635;animation:msgIn .2s}
.comment-block .c-who{font-size:10px;font-weight:700;color:#7f8aa5;margin-bottom:3px}
.comment-block .c-text{font-size:11px;color:#9aa7c2;line-height:1.45}

/* 底部操作区 */
.bottom-area{flex-shrink:0;border-top:1px solid #282e3c;background:#0f1219;padding:10px 14px 12px;max-height:240px;overflow-y:auto;scrollbar-width:thin}
.bottom-area::-webkit-scrollbar{width:3px}
.bottom-area::-webkit-scrollbar-thumb{background:#333d52;border-radius:10px}

.ctrl-tabs{display:flex;gap:4px;margin-bottom:8px}
.ctrl-tab{padding:5px 11px;border-radius:9px;font-size:11px;font-weight:600;color:#7f8aa5;background:#0d1119;cursor:pointer;border:1px solid transparent;font-family:inherit;transition:.12s}
.ctrl-tab.active{background:#2e271f;color:#e5c48c;border-color:#5c4b38}
.ctrl-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.ctrl-btn{display:block;width:100%;padding:8px 11px;background:#1a202c;border:1px solid #2c3546;border-radius:9px;color:#c4cfe4;font-size:11px;text-align:left;cursor:pointer;transition:.1s;font-family:inherit;line-height:1.35}
.ctrl-btn:active{transform:scale(.98);background:#232d3f}
.ctrl-btn .sub{display:block;font-size:9px;color:#6b7690;margin-top:1px}
.ctrl-btn.highlight{border-color:#6b553b;background:#1e1a13}

.input-row{display:flex;gap:6px}
.input-row .shout-input{flex:1;background:#0a0e15;border:1px solid #2a3242;border-radius:10px;padding:9px 12px;color:#d5deee;font-size:12px;outline:none;font-family:inherit}
.input-row .shout-input::placeholder{color:#4a5468}
.input-row .shout-btn{background:#3b2f22;border:1px solid #6b553b;border-radius:10px;padding:0 15px;color:#e5c48c;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit}
.input-row .shout-btn:active{background:#4d3e2b}

.hint{font-size:9px;color:#4a5468;margin-top:5px;line-height:1.4}

/* 结局 */
.ending-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;text-align:center}
.ending-wrap .e-title{font-size:21px;font-weight:800;color:#e5c48c;margin-bottom:12px}
.ending-wrap .e-desc{font-size:13px;color:#b9c4da;line-height:1.7;background:#0a0d13;border-radius:14px;padding:18px;max-width:500px;text-align:left;white-space:pre-wrap;border:1px solid #252e3f}
.ending-wrap .e-tag{font-size:11px;color:#7f8aa5;margin-top:14px}
.restart-btn{display:inline-block;margin-top:18px;padding:11px 30px;background:#3b2f22;border:1px solid #6b553b;border-radius:10px;color:#e5c48c;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.restart-btn:active{background:#4d3e2b}

/* 开场 */
.intro-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 30px;text-align:center}
.intro-wrap h1{font-size:26px;font-weight:800;color:#e5c48c;margin-bottom:4px;letter-spacing:.5px}
.intro-wrap .sub{font-size:12px;color:#7f8aa5;letter-spacing:2px;margin-bottom:20px}
.intro-wrap .desc{font-size:13px;color:#9aa7c2;line-height:1.7;max-width:420px;margin-bottom:16px}
.intro-wrap .name-input{width:280px;background:#0a0e15;border:1px solid #2a3242;border-radius:10px;padding:12px 14px;color:#d5deee;font-size:14px;outline:none;font-family:inherit;margin-bottom:12px;text-align:center}
.intro-wrap .name-input::placeholder{color:#5a6478}
.intro-wrap .start-btn{width:280px;padding:13px;background:#3b2f22;border:1px solid #6b553b;border-radius:10px;color:#e5c48c;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;letter-spacing:1px}
.intro-wrap .start-btn:active{background:#4d3e2b}
.intro-wrap .tip{font-size:11px;color:#5a6478;margin-top:14px;line-height:1.6;max-width:360px}

.hidden{display:none!important}

@media(max-width:800px){
  .app{flex-direction:column;max-width:100%;height:auto;max-height:none;border-radius:0}
  .left-panel{width:100%;min-width:0;border-right:none;border-bottom:1px solid #282e3c;max-height:40vh}
  .right-panel{min-height:60vh}
  .bottom-area{max-height:280px}
}
</style>
</head>
<body>
<div class="app">
  <div class="left-panel">
    <div class="panel-header">
      <h1>小雨披大导演</h1>
      <div class="sub" id="dirLabel">导演连接中</div>
    </div>
    <div class="panel-body" id="leftBody"></div>
  </div>
  <div class="right-panel">
    <div class="tab-header">
      <button class="tab-btn active" onclick="switchMainTab('dm')" id="tabDm">WVS DM</button>
      <button class="tab-btn" onclick="switchMainTab('space')" id="tabSpace">空间</button>
    </div>
    <div class="tab-content active" id="tabContentDm">
      <div class="chat-body" id="chatBody"></div>
      <div class="bottom-area" id="bottomArea"></div>
    </div>
    <div class="tab-content" id="tabContentSpace">
      <div class="space-body" id="spaceBody"></div>
      <div class="bottom-area" id="spaceBottomArea"></div>
    </div>
  </div>
</div>

<script>
/* ============ 全局状态 ============ */
const S = {
  directorName: "无名导演",
  intimacy: 12,
  redHeat: 20,
  doorProgress: 0,
  round: 0,
  gameOver: false,
  started: false,
  snapCount: 0,
  dmInterval: null,
  dmIndex: 0,
  logLines: [],
  lastAction: null,
  lastActionDetail: "",
  currentTab: "basic",
  mainTab: "dm",
  spacePostId: 0
};

const $ = id => document.getElementById(id);

/* ============ 聊天消息 ============ */
function addChatMsg(side, name, text, role){
  const chatBody = $("chatBody");
  if(!chatBody) return;
  const div = document.createElement("div");
  let cls = "msg " + side;
  if(role === "sw") cls += " char-sw";
  if(role === "zj") cls += " char-zj";
  div.className = cls;
  const avatarClass = role || (side==="left"?"fan":"dir");
  const initial = name.length>0 ? name.charAt(0) : "?";
  div.innerHTML = `
    <div class="avatar ${avatarClass}">${initial}</div>
    <div class="bubble">
      <span class="who ${avatarClass}">${name}</span>
      ${text}
    </div>
  `;
  chatBody.appendChild(div);
  chatBody.scrollTop = chatBody.scrollHeight;
  while(chatBody.children.length > 120) chatBody.removeChild(chatBody.firstChild);
}

function addSystemMsg(text, big){
  const chatBody = $("chatBody");
  if(!chatBody) return;
  const div = document.createElement("div");
  div.className = "sys-msg" + (big?" big":"");
  div.textContent = text;
  chatBody.appendChild(div);
  chatBody.scrollTop = chatBody.scrollHeight;
}

function addLog(txt){
  S.logLines.push(`[R${S.round}] ${txt}`);
  if(S.logLines.length > 6) S.logLines.shift();
  const el = $("logBox");
  if(el) el.innerHTML = S.logLines.map(l=>`<div>${l}</div>`).join("");
}

function updateBars(){
  const setV = (id,v)=>{ const e=$(id); if(e) e.textContent = v; };
  setV("vIntimacy", S.intimacy);
  setV("vRedHeat", S.redHeat);
  setV("vDoor", S.doorProgress + "%");
  const p = $("progIn");
  if(p) p.style.width = S.doorProgress + "%";
}

/* ============ 观众对导演发言触发 ============ */
const DIRECTOR_TRIGGERS = [
  { kw:["老婆","我爱你"], react:["导演你够了哈哈哈","申惟听到又要耳朵红了","这话我不敢接","你直接说结婚算了"] },
  { kw:["苹果","吃苹果"], react:["啊这个梗又来了","韩振：吃苹果吗？ 我：好","导演在嗑什么呢","苹果说它不想被扯进来"] },
  { kw:["躲","对视"], react:["申惟：我没有躲（第三次）","导演别揭穿他了","韩振：哥你刚刚又转过去了","这段我能看一天"] },
  { kw:["济州岛","旅行"], react:["韩振：我记着呢","申惟：……下次吧","这话他说过好几次了","济州岛民宿我先订了"] },
  { kw:["亲","kiss"], react:["导演你在说什么","直播呢！！","我截图了","这是我能看的吗"] },
  { kw:["坦白","真心"], react:["韩振：哥你要坦白什么","申惟：……没什么","这气氛突然安静了","导演问得好"] },
  { kw:["哭","不要哭"], react:["申惟：韩振尼别哭","韩振：我没哭","导演你太会了","眼眶红了的是申惟吧"] },
  { kw:["门","出去"], react:["门：你们倒是做点该做的事","进度条卡住了","导演加油","我也想知道门怎么开"] },
  { kw:["申惟","韩振"], react:["叫全名了叫全名了","申惟听到韩振叫全名就紧张","韩振：申惟。 申惟：……嗯？","连名带姓最好嗑"] }
];

function audienceReactToDirector(text){
  const hit = DIRECTOR_TRIGGERS.find(t=>t.kw.some(k=>text.includes(k)));
  if(hit){
    const r = hit.react[Math.floor(Math.random()*hit.react.length)];
    setTimeout(()=>addChatMsg("left", pickAudienceName(), r, "fan"), 400 + Math.random()*500);
    if(Math.random()<0.7){
      const r2 = hit.react[Math.floor(Math.random()*hit.react.length)];
      setTimeout(()=>addChatMsg("left", pickAudienceName(), r2, "fan"), 1200 + Math.random()*700);
    }
  } else {
    setTimeout(()=>addChatMsg("left", pickAudienceName(), "导演在说什么哈哈哈", "fan"), 500 + Math.random()*400);
    setTimeout(()=>addChatMsg("left", pickAudienceName(), "导演自己玩起来了", "fan"), 1300 + Math.random()*600);
  }
}

function pickAudienceName(){
  const names = ["饺子成精","鱼骑自行车","吃苹果吗","兔耳朵","深夜面包","柑橘味","监控探头","韩振保护协会","镜子","小雨披分雨","糖分超标","自行车维修工","申惟的耳根","韩振的中文教室","监控室常驻","门锁观察员"];
  return names[Math.floor(Math.random()*names.length)];
}

/* ============ 导演喊话 ============ */
const SHOUT_TRIGGERS = [
  { kw:["老婆","我爱你"], react:"申惟：韩振啊……老婆……这个单词，哥只跟你学过一次。韩振：哥现在说这个干嘛啊真是……", int:+6, red:+8 },
  { kw:["苹果","吃苹果"], react:"韩振：（突然用中文）吃苹果吗？ 申惟：好。 两个人同时愣住。韩振：……哥怎么秒答啊。", int:+5, red:+6 },
  { kw:["躲","对视"], react:"申惟：我没有躲。韩振：哥你刚刚转头了。申惟：……那是看镜头。韩振：镜头在我后面吗？申惟不说话了。", int:+4, red:+10 },
  { kw:["济州岛","旅行"], react:"韩振：哥之前说好一起去济州岛的。申惟：……我说过吗？韩振：说过。我记得。申惟耳根红了。", int:+7, red:+5 },
  { kw:["哭","不要哭"], react:"申惟：韩振尼别哭。韩振：我没哭。申惟：你眼眶红了。韩振：……哥才是爱哭的那个。", int:+6, red:+7 },
  { kw:["亲","kiss"], react:"申惟：……在这里？韩振：导演看着呢。两个人都不自然地看向摄像头。", int:+8, red:+14 },
  { kw:["坦白","真心"], react:"韩振：哥，我没有不听话的时候吗？申惟想了很久：有。韩振笑了：那哥为什么从来不说。申惟：……因为说了你也不听。", int:+9, red:+6 },
  { kw:["英文","英语"], react:"申惟：I love you? 韩振：发音错了哥。申惟：……那你教我。韩振：不教。申惟：为什么。韩振：哥学会了对别人说怎么办。", int:+7, red:+11 }
];

function doShout(){
  const inp = $("shoutInput");
  if(!inp || !inp.value.trim() || S.gameOver) return;
  const text = inp.value.trim();
  inp.value = "";
  S.round++;
  addChatMsg("right", S.directorName, text, "dir");
  const hit = SHOUT_TRIGGERS.find(t=>t.kw.some(k=>text.includes(k)));
  if(hit){
    S.intimacy = Math.min(100,S.intimacy+hit.int);
    S.redHeat = Math.min(100,S.redHeat+hit.red);
    addLog(hit.react);
    const parts = hit.react.split("。");
    let delay = 500;
    parts.forEach(p=>{
      if(!p.trim()) return;
      const isSw = p.includes("申惟") && !p.includes("韩振：");
      const role = isSw ? "sw" : "zj";
      setTimeout(()=>addChatMsg("left", isSw?"申惟":"韩振", p.trim()+"。", role), delay);
      delay += 650;
    });
    setTimeout(()=>addChatMsg("left", pickAudienceName(), "导演好会！", "fan"), delay+300);
    setTimeout(()=>addChatMsg("left", pickAudienceName(), "这段我截图了！", "fan"), delay+700);
  } else {
    S.intimacy = Math.min(100,S.intimacy+1);
    addLog(`导演喊话：「${text.slice(0,20)}」→ 两人对视了一下，没说话。`);
    setTimeout(()=>addChatMsg("left","申惟","……导演说什么？", "sw"),500);
    setTimeout(()=>addChatMsg("left","韩振","哥没听懂吗？", "zj"),1000);
  }
  audienceReactToDirector(text);

  let ticks = 0;
  const maxTicks = 8 + Math.floor(Math.random()*5);

    ticks++;
    if(likeEl){ likeCount += Math.floor(Math.random()*6)+1; likeEl.textContent = likeCount; likeEl.classList.add("grow"); setTimeout(()=>likeEl.classList.remove("grow"),300); }

  if(S.dmIndex >= DM_LINES.length) S.dmIndex = 0;
  pushDM();
  S.dmInterval = setInterval(()=>{

    pushDM();
    if(Math.random() < 0.6) pushDM();

/* ============ 结局 ============ */
function checkEnding(){
  if(S.gameOver) return;
  if(S.doorProgress >= 100){
    S.gameOver = true;
    if(S.dmInterval) clearInterval(S.dmInterval);
    showEnding("doorOpen");
  } else if(S.redHeat >= 95){
    S.gameOver = true;
    if(S.dmInterval) clearInterval(S.dmInterval);
    showEnding("redOverload");
  } else if(S.round >= 22 && S.intimacy < 30){
    S.gameOver = true;
    if(S.dmInterval) clearInterval(S.dmInterval);
    showEnding("timeout");
  }
}

    <button class="shout-btn" onclick="doShout()">发送</button>
  </div>
  <div class="hint">触发词：老婆 / 我爱你 / 苹果 / 吃苹果 / 躲 / 对视 / 济州岛 / 哭 / 亲 / 坦白 / 门 / 出去 / 申惟 / 韩振</div>`;
  el.innerHTML = html;
}

function renderSpaceBottom(){
  const el = $("spaceBottomArea");
  if(!el) return;
  el.innerHTML = `<button class="ctrl-btn" onclick="takeSnap()" style="text-align:center;background:#3b2f22;border-color:#6b553b;color:#e5c48c;font-weight:700">截图并发布到空间</button>
  <div class="hint" style="text-align:center">执行动作后截图，粉丝会蜂拥而来点赞评论转发</div>`;
}

function switchCtrlTab(t){
  S.currentTab = t;
  renderBottomArea();
}

function switchMainTab(t){
  S.mainTab = t;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));
  if(t==="dm"){
    $("tabDm").classList.add("active");
    $("tabContentDm").classList.add("active");
    renderBottomArea();
  } else {
    $("tabSpace").classList.add("active");
    $("tabContentSpace").classList.add("active");
    renderSpaceBottom();
  }
}

/* ============ 渲染左侧 ============ */
function renderLeft(){
  const leftBody = $("leftBody");
  leftBody.innerHTML = `
    <div class="feed">
      <div class="room">
        <div class="actors">
          <div class="actor"><div class="nm">申惟</div><div class="tg">队长 · 03 · INFP · 天蝎</div></div>
          <div class="actor"><div class="nm">韩振</div><div class="tg">唯一中国成员 · 06 · INFJ · 摩羯</div></div>
        </div>
        <div class="bars">
          <div class="bar-item"><div class="lb">亲密值</div><div class="vl blue" id="vIntimacy">${S.intimacy}</div></div>
          <div class="bar-item"><div class="lb">红温度</div><div class="vl red" id="vRedHeat">${S.redHeat}</div></div>
          <div class="bar-item"><div class="lb">开门进度</div><div class="vl green" id="vDoor">${S.doorProgress}%</div></div>
        </div>
        <div class="progress-out"><div class="progress-in" id="progIn" style="width:${S.doorProgress}%"></div></div>
      </div>
    </div>
    <div class="log" id="logBox">${S.logLines.map(l=>`<div>${l}</div>`).join("")}</div>
  `;
}

/* ============ 主界面 ============ */
function renderMain(){
  renderLeft();
  const chatBody = $("chatBody");
  chatBody.innerHTML = "";
  addSystemMsg("监控启动。" + S.directorName + "导演已就位。", true);
  addSystemMsg("申惟和韩振被关进房间。广播说亲密值和红温度达标才能开门。");
  const spaceBody = $("spaceBody");
  spaceBody.innerHTML = "";
  renderBottomArea();
  renderSpaceBottom();
  startDM();
  updateBars();
  $("dirLabel").textContent = S.directorName + " · 监控中";
}

/* ============ 开场 ============ */
function renderIntro(){
  const app = document.querySelector(".app");
  app.innerHTML = `
    <div class="intro-wrap" style="width:100%">
      <h1>小雨披大导演</h1>
      <div class="sub">锐因 · 不XX就不能出去的房间</div>
      <div class="desc">
        申惟和韩振被关进了一个奇怪的房间。<br>
        门锁死了，广播说：做完“该做的事”才能出去。<br><br>
        你是监控室的导演。指挥他们互动，把门打开。<br>
        试试看吧，导演大人。<br><br>
        <span style="color:#e5c48c">导演怎么称呼。</span>
      </div>
      <input class="name-input" id="nameInput" placeholder="输入导演名（例：雨披）" maxlength="12">
      <button class="start-btn" onclick="startGame()">进入监控室</button>
      <div class="tip">
        · 底部控制台切Tab选不同动作<br>
        · 喊话输入触发词有特殊反应，观众也会回应<br>
        · 申惟和韩振的弹幕有特殊样式<br>
        · 亲密值+红温度决定开门进度<br>
        · 空间截图后赞评转会持续增长
      </div>
    </div>
  `;
}

window.startGame = function(){
  const inp = $("nameInput");
  S.directorName = (inp && inp.value.trim()) || "无名导演";
  S.started = true;
  S.logLines = [
    `监控启动。${S.directorName}导演已就位。`,
    `申惟和韩振被关进房间。申惟站在墙角，韩振坐在床沿。`,
    `广播：亲密值和红温度达到一定程度，门会自动打开。`
  ];
  document.querySelector(".app").innerHTML = `
    <div class="left-panel">
      <div class="panel-header">
        <h1>小雨披大导演</h1>
        <div class="sub" id="dirLabel">${S.directorName} · 监控中</div>
      </div>
      <div class="panel-body" id="leftBody"></div>
    </div>
    <div class="right-panel">
      <div class="tab-header">
        <button class="tab-btn active" onclick="switchMainTab('dm')" id="tabDm">WVS DM</button>
        <button class="tab-btn" onclick="switchMainTab('space')" id="tabSpace">空间</button>
      </div>
      <div class="tab-content active" id="tabContentDm">
        <div class="chat-body" id="chatBody"></div>
        <div class="bottom-area" id="bottomArea"></div>
      </div>
      <div class="tab-content" id="tabContentSpace">
        <div class="space-body" id="spaceBody"></div>
        <div class="bottom-area" id="spaceBottomArea"></div>
      </div>
    </div>
  `;
  renderMain();
};

window.doShout = doShout;
window.doAction = doAction;
window.switchCtrlTab = switchCtrlTab;
window.switchMainTab = switchMainTab;
window.takeSnap = takeSnap;
window.ACTIONS = ACTIONS;

renderIntro();
</script>
</body>
</html>
